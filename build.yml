name: Build App Inventor extension
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AIX
        id: build
        uses: pavi2410/AIX-Action@main
        with:
          source-dir: src
          package-name: com.freddy.logdownloaderwifi
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: LogDownloaderWifiConnector-AIX
          path: ${{ steps.build.outputs.extension-path }}
